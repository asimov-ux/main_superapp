<!-- ============================
     LANDING PAGE (SEM LAYOUT)
=============================== -->
<ng-container *ngIf="isWelcomePage; else fullApp">
  <router-outlet></router-outlet>
</ng-container>

<!-- ============================
        LAYOUT COMPLETO
=============================== -->
<ng-template #fullApp>
  <div class="app-shell">
    <!-- ========== HEADER CAIXA - FLUENT STYLE ========== -->
    <header class="header">
      <div class="header__container">
        <!-- Logo CAIXA -->
        <div class="header__brand">
          <span class="header__logo-text">CAIXA</span>
          <span class="header__separator">|</span>
          <span class="header__app-name">Portal de Benefícios</span>
        </div>

        <!-- Search Bar -->
        <div class="header__search">
          <svg class="search-icon" viewBox="0 0 16 16" fill="currentColor">
            <path
              d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"
            />
          </svg>
          <input type="text" placeholder="Pesquisar..." class="search-input" />
        </div>

        <!-- Ações do Header -->
        <div class="header__actions">
          <!-- Notificações -->
          <button class="header__btn" title="Notificações">
            <svg viewBox="0 0 16 16" fill="currentColor">
              <path
                d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2zM8 1.918l-.797.161A4.002 4.002 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4.002 4.002 0 0 0-3.203-3.92L8 1.917zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5.002 5.002 0 0 1 13 6c0 .88.32 4.2 1.22 6z"
              />
            </svg>
            <span class="notification-badge">3</span>
          </button>

          <!-- Ajuda -->
          <button class="header__btn" title="Ajuda">
            <svg viewBox="0 0 16 16" fill="currentColor">
              <path
                d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"
              />
              <path
                d="M5.255 5.786a.237.237 0 0 0 .241.247h.825c.138 0 .248-.113.266-.25.09-.656.54-1.134 1.342-1.134.686 0 1.314.343 1.314 1.168 0 .635-.374.927-.965 1.371-.673.489-1.206 1.06-1.168 1.987l.003.217a.25.25 0 0 0 .25.246h.811a.25.25 0 0 0 .25-.25v-.105c0-.718.273-.927 1.01-1.486.609-.463 1.244-.977 1.244-2.056 0-1.511-1.276-2.241-2.673-2.241-1.267 0-2.655.59-2.75 2.286zm1.557 5.763c0 .533.425.927 1.01.927.609 0 1.028-.394 1.028-.927 0-.552-.42-.94-1.029-.94-.584 0-1.009.388-1.009.94z"
              />
            </svg>
          </button>

          <!-- User -->
          <button class="header__btn header__user-btn">
            <svg viewBox="0 0 16 16" fill="currentColor">
              <path
                d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM8 9a5 5 0 0 0-5 5v1h10v-1a5 5 0 0 0-5-5z"
              />
            </svg>
          </button>

          <span class="header__username">#INTERNO.CAIXA</span>

          <!-- Logout -->
          <button class="header__btn header__logout" title="Sair">
            <svg viewBox="0 0 16 16" fill="currentColor">
              <path
                fill-rule="evenodd"
                d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0v2z"
              />
              <path
                fill-rule="evenodd"
                d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3z"
              />
            </svg>
            <span>Sair</span>
          </button>
        </div>
      </div>
    </header>

    <!-- ========== SIDEBAR + CONTENT ========== -->
    <div class="app-body">
      <!-- Sidebar -->
      <aside class="sidebar" [class.sidebar--pinned]="sidebarPinned">
        <!-- Pin Button -->
        <button
          class="sidebar__pin-btn"
          (click)="toggleSidebarPin()"
          [title]="sidebarPinned ? 'Desafixar menu' : 'Fixar menu'"
        >
          <!-- ícones mantidos -->
        </button>

        <!-- Navigation -->
        <nav class="sidebar__nav">
          <!-- TODOS seus links mantidos -->
          <a
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="sidebar__item"
          >
            <!-- ícone -->
            <span>Início</span>
          </a>

          <a
            routerLink="/people"
            routerLinkActive="active"
            class="sidebar__item"
          >
            <span>Pessoas</span>
          </a>

          <a
            routerLink="/beneficios"
            routerLinkActive="active"
            class="sidebar__item"
          >
            <span>Benefícios</span>
          </a>

          <a
            routerLink="/ausencias"
            routerLinkActive="active"
            class="sidebar__item"
          >
            <span>Ausências</span>
          </a>

          <a
            routerLink="/dashboard"
            routerLinkActive="active"
            class="sidebar__item"
          >
            <span>Dashboard</span>
          </a>
        </nav>

        <div class="sidebar__footer">
          <app-brand-selector></app-brand-selector>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <router-outlet></router-outlet>
      </main>
    </div>

    <!-- ========== FOOTER ========== -->
    <footer class="footer site-footer">
      <div class="footer__left">
        <span>GEFUB - GN Funcef e Benefícios</span>
      </div>

      <div class="footer__right">
        <span>Versão 1.2</span>
        <span class="footer__separator">|</span>
        <span>#INTERNO.CAIXA</span>
        <span class="footer__separator">|</span>
        <span>13 Usuário(s) Online</span>
        <span class="footer__separator">|</span>
        <span>50 acessos - total</span>
      </div>
    </footer>

    <app-update-prompt></app-update-prompt>
  </div>
</ng-template>
